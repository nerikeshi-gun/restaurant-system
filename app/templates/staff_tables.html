<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>テーブル選択｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260815-1"></head>
<body><header><strong>{{ restaurant_name }} 店員用</strong><a href="/" class="header-link">戻る</a></header>
<main class="page narrow"><h1>テーブルを選ぶ</h1><p class="hint">注文を取るテーブルを押してください。</p>
<div class="table-grid">{% for table in tables %}<a class="table-button" href="/staff/table/{{ table.id }}"><strong>{{ table.number }}番テーブル</strong><span>{{ '使用中' if table.usage_status == 'occupied' else '利用可能' }}</span></a>{% endfor %}</div>
</main></body></html>
