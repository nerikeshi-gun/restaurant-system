<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テーブル {{ table.number }}｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260809-4"></head>
<body class="customer" data-session-id="{{ session.id }}"><header><strong>{{ restaurant_name }}</strong><span>テーブル {{ table.number }}</span></header>
<main class="page narrow">
  <section id="input-panel"><h1>ご注文をどうぞ</h1><p class="hint">話した内容は、注文前に画面で確認できます。</p>
    <div class="input-row"><input id="order-text" autocomplete="off" placeholder="例：アサヒの生を2つ"><button id="interpret" class="primary">注文を探す</button></div>
    <p class="hint">Androidキーボードのマイクからも入力できます。</p>
    <div class="quick"><button data-request="water" class="service-water">お冷</button><button data-request="checkout" class="service-checkout">お会計</button></div>
  </section>
  <section id="result" class="hidden"></section>
  <section><details><summary>メニューから選ぶ</summary><div id="menu" class="menu-list"></div></details></section>
  <div id="toast" class="toast hidden"></div>
</main>
<nav class="customer-fixed-nav" aria-label="画面操作">
  <button id="go-order" class="primary">注文へ</button>
  <button id="go-back">戻る</button>
</nav>
<script src="/static/ws-client.js?v=20261022-1"></script><script src="/static/customer.js?v=20261022-1"></script></body></html>
