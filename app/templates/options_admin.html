<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>オプション設定｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260821-6"></head>
<body class="admin-page"><header><strong>{{ restaurant_name }} オプション設定</strong><a href="/admin/menu" class="header-link">メニュー管理へ戻る</a></header><main class="page admin-main">
<h1>オプション</h1><p class="hint">辛さ、ごはん量、トッピングなどのオプションを作り、メニュー編集画面で商品へ割り当てます。過去の注文内容は変更されません。</p>
<form id="modifier-group-create" class="form-section option-create-form"><div class="form-field"><label for="new-group-name">オプション名</label><input id="new-group-name" required maxlength="100" placeholder="例：辛さ"></div><div class="form-field"><label for="new-group-type">選び方</label><select id="new-group-type"><option value="single">1つ選択</option><option value="multiple">複数選択</option></select></div><div class="form-field"><label for="new-group-order">表示順</label><input id="new-group-order" type="number" min="0" max="9999" value="10"></div><button class="primary" type="submit">オプションを追加</button></form>
<div id="option-admin-message" class="hint"></div><div id="modifier-group-list" class="modifier-group-list"></div>
</main><script src="/static/options-admin.js?v=20260822-1"></script></body></html>
