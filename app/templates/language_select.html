<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Language｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260822-2"></head>
<body class="language-select-page" style="--accent:{{ theme_color }}">
<header><strong>{{ restaurant_name }}</strong><span>{{ table.number }}番テーブル</span></header>
<main class="language-select-main">
  <section class="language-select-card">
    <div class="language-icon" aria-hidden="true">🌐</div>
    <h1>言語を選んでください</h1>
    <p>Please select your language</p>
    <div class="language-buttons">
      <a href="{{ order_path }}?lang=ja" lang="ja"><strong>日本語</strong><span>Japanese</span></a>
      <a href="{{ order_path }}?lang=en" lang="en"><strong>English</strong><span>英語</span></a>
      <a href="{{ order_path }}?lang=zh" lang="zh"><strong>中文</strong><span>Chinese</span></a>
      <a href="{{ order_path }}?lang=ko" lang="ko"><strong>한국어</strong><span>Korean</span></a>
      <a href="{{ order_path }}?lang=vi" lang="vi"><strong>Tiếng Việt</strong><span>Vietnamese</span></a>
      <a href="{{ order_path }}?lang=ur" lang="ur" dir="rtl"><strong>اردو</strong><span>Urdu</span></a>
    </div>
  </section>
</main>
</body></html>
