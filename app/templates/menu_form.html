<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }}｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260821-2"></head>
<body class="admin-page" data-menu-item-id="{{ item_id }}"><header><strong>{{ restaurant_name }} {{ page_title }}</strong><a href="/admin/menu" class="header-link">メニュー管理へ戻る</a></header>
<main class="page menu-form-page"><div class="form-heading"><div><h1>{{ page_title }}</h1><p class="hint">登録・変更した内容は、保存後すぐに注文画面と注文解析へ反映されます。</p></div></div>
<form id="menu-item-form" class="menu-register-form">
  <section class="form-section"><h2>基本情報</h2>
    <div class="form-grid"><div class="form-field"><label for="menu-code">商品コード <span>必須</span></label><input id="menu-code" required maxlength="80" placeholder="例：M201"></div><div class="form-field"><label for="category-id">カテゴリ <span>必須</span></label><select id="category-id" required></select></div><div class="form-field form-wide"><label for="menu-name">商品名 <span>必須</span></label><input id="menu-name" required maxlength="200" placeholder="例：日替わりランチ"></div><div class="form-field"><label for="short-name">短い表示名</label><input id="short-name" maxlength="100" placeholder="例：日替わり"></div><div class="form-field"><label for="reading">読み方</label><input id="reading" maxlength="200" placeholder="例：ひがわりらんち"></div><div class="form-field"><label for="price">価格（税込） <span>必須</span></label><div class="price-input"><input id="price" type="number" min="0" max="10000000" required value="0"><strong>円</strong></div></div><div class="form-field"><label for="display-order">カテゴリ内の表示順</label><input id="display-order" type="number" min="0" max="9999" value="10"></div></div>
  </section>
  <section class="form-section"><h2>注文時の補足</h2><div class="form-grid"><div class="form-field form-wide"><label for="aliases">別名・呼び方</label><input id="aliases" placeholder="例：日替わり、今日のランチ"><p class="field-help">複数ある場合は「、」で区切ります。音声注文の候補探しに使います。</p></div><div class="form-field"><label for="size-label">サイズ表記</label><input id="size-label" maxlength="100" placeholder="例：並"></div><div class="form-field form-wide"><label for="set-contents">セット内容</label><textarea id="set-contents" rows="3" maxlength="1000" placeholder="例：ご飯、味噌汁、小鉢付き"></textarea></div></div></section>
  <section class="form-section"><h2>多言語の商品名</h2><p class="field-help">空欄の言語では日本語の商品名を表示します。ここに登録した名前は、その言語の音声注文の照合にも使われます。</p><div class="form-grid multilingual-name-grid"><div class="form-field"><label for="name-en">English</label><input id="name-en" maxlength="200" placeholder="English name"></div><div class="form-field"><label for="name-zh">中文</label><input id="name-zh" maxlength="200" placeholder="中文名称"></div><div class="form-field"><label for="name-ko">한국어</label><input id="name-ko" maxlength="200" placeholder="한국어 이름"></div><div class="form-field"><label for="name-vi">Tiếng Việt</label><input id="name-vi" maxlength="200" placeholder="Tên tiếng Việt"></div><div class="form-field"><label for="name-ur">اردو</label><input id="name-ur" dir="rtl" maxlength="200" placeholder="اردو نام"></div></div></section>
  <section class="form-section"><div class="section-title-row"><div><h2>オプション</h2><p class="field-help">この商品で表示する辛さ、ごはん量、トッピングなどを設定します。必須にすると、選ぶまで注文へ追加できません。</p></div><a href="/admin/options" class="link-button">オプションを作る</a></div><div id="menu-modifier-groups" class="menu-modifier-groups"></div></section>
  <section class="form-section"><h2>販売状態</h2><label class="availability-switch"><input id="is-available" type="checkbox" checked><span>注文を受け付ける</span></label></section>
  <div id="menu-form-message" class="form-message hidden"></div><div class="form-actions"><a href="/admin/menu" class="link-button">取り消し</a><button id="save-menu-item" class="primary" type="submit">保存する</button></div>
</form></main><script src="/static/menu-form.js?v=20260822-2"></script></body></html>
