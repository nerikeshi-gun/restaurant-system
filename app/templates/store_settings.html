<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>店舗・画面設定｜{{ restaurant_name }}</title><link rel="stylesheet" href="/static/app.css?v=20260821-6"></head>
<body class="admin-page"><header><strong>{{ restaurant_name }} 店舗・画面設定</strong><a href="/admin/menu" class="header-link">メニュー管理へ戻る</a></header><main class="page admin-main">
<h1>店舗・画面設定</h1><p class="hint">店名と注文画面の並びを、コードを触らず変更できます。</p>
<form id="store-settings-form" class="menu-register-form">
  <section class="form-section"><h2>店舗表示</h2><div class="form-grid"><div class="form-field form-wide"><label for="store-name">店名</label><input id="store-name" required maxlength="200"></div><div class="form-field"><label for="theme-color">ボタンの基本色</label><div class="theme-color-row"><input id="theme-color" type="color" value="#b74328"><span id="theme-color-code">#b74328</span></div></div></div></section>
  <section class="form-section"><h2>注文画面の箱</h2><div class="device-switch" role="group" aria-label="編集する端末"><button type="button" class="selected" data-device="desktop">PC表示</button><button type="button" data-device="tablet">タブレット表示</button></div><p id="device-layout-help" class="hint">PCでの並びを編集中です。箱をドラッグするか、上下ボタンで並べ替えます。</p><div id="layout-box-list" class="layout-editor-list"></div></section>
  <section class="form-section"><h2>「ご注文内容」の場所</h2><div class="form-field"><label for="order-position">表示位置</label><select id="order-position"><option value="right">右側（標準）</option><option value="top">画面の上</option><option value="bottom">画面の下</option></select></div></section>
  <section class="form-section"><h2>配置プレビュー</h2><p class="hint">実際の注文画面は端末の幅に合わせて自動調整されます。</p><div id="layout-preview" class="layout-preview" aria-label="注文画面の配置プレビュー"></div></section>
  <div id="store-settings-message" class="form-message hidden"></div><div class="form-actions"><a class="link-button" href="/admin/menu">取り消し</a><button class="primary" type="submit">設定を保存</button></div>
</form></main><script src="/static/store-settings.js?v=20260822-4"></script></body></html>
